# The one task in flight.
#
# Exactly ONE at a time. An agent claims it by writing this file before its
# first edit, and clears it when the task ends — whether it finished or stopped.
#
# ---------------------------------------------------------------------------
# Lifecycle
# ---------------------------------------------------------------------------
#
#   idle ──claim──▶ in_progress ──┬──▶ done     → reset to idle
#                                 └──▶ blocked  → stays, with blocked_reason
#
#   An agent may claim only from `idle`.
#   `blocked` is NOT idle. It holds the slot deliberately: the next agent must
#   read why the last one stopped before starting anything.
#
# ---------------------------------------------------------------------------
# The lock rule
# ---------------------------------------------------------------------------
#
#   If `lock: held` and `claimed_by` is not you — STOP. Do not read further, do
#   not "just check something", do not take the lock.
#
#   NEVER steal a lock, even one that looks stale. An agent cannot tell a dead
#   run from a slow one. A lock that looks abandoned is REPORTED to the user,
#   who clears it. That is the whole recovery procedure.
#
#   Signals that a lock may be dead — for the report, not for a decision:
#     - claimed_at is hours old and `git status` shows nothing in files_allowed
#     - claimed_by names an agent this session did not start
#     - status is in_progress but build-state.yaml already records the step
#
# ---------------------------------------------------------------------------
# Field reference
# ---------------------------------------------------------------------------
#
#   task.id            Sxx, from reports/plan/implementation-plan.md
#   task.phase         the phase id from service.yaml (tier S and M: `main`)
#   task.contract      the contract file that phase names. Never two at once.
#
#   claim.claimed_by   agent name, stable for the run
#   claim.claimed_at   ISO-8601 UTC
#   claim.lock         free | held
#
#   scope.files_allowed  paths this task may write. A write outside this list is
#                        a reject in review, however good the change.
#   scope.repos_allowed  harness | target. NEVER a reference repository.
#
#   depends_on.decisions   PD ids that must be DECIDED first. An OPEN blocking
#                          entry here means REFUSE the task, not work around it.
#   depends_on.questions   Q ids that must be CLOSED first.
#   depends_on.steps       Sxx that must be done first
#
#   verification.checks         checks/*.sh to run, with their expected exit code
#   verification.cases          acceptance case ids that must pass
#   verification.expected_result  concrete enough that two people would agree
#                                 whether it holds
#
#   status             idle | in_progress | blocked | done
#   blocked_reason     required when status is blocked. Say what would unblock it.
#
# ---------------------------------------------------------------------------
# Worked example — what a claimed task looks like
# ---------------------------------------------------------------------------
#
#   task:
#     id: S07
#     title: Implement GET /api/v1/tasks/{taskId}
#     phase: main
#     contract: architecture.yaml
#   claim:
#     claimed_by: build-implementer
#     claimed_at: "2026-11-06T09:14:00Z"
#     lock: held
#   scope:
#     files_allowed:
#       - src/main/java/com/example/vendortask/adapter/in/web/TaskController.java
#       - src/test/java/com/example/vendortask/adapter/in/web/TaskControllerTest.java
#     repos_allowed: [target]
#   depends_on:
#     decisions: [PD-001]
#     questions: []
#     steps: [S03]
#   verification:
#     checks:
#       - {script: checks/architecture.sh, expect: 0}
#       - {script: checks/forbidden-tech.sh, expect: 0}
#     cases: [A-E1-01, A-E1-02, A-E1-03]
#     expected_result: >
#       GET /api/v1/tasks/7 answers 200 with the body recorded in
#       acceptance/expected/A-E1-01.json, X-TRACE-ID present, and vendor.name
#       absent when the vendor lookup exhausts its retry budget.
#   status: in_progress
#   blocked_reason: null
#
# ---------------------------------------------------------------------------

task:
  id: null
  title: null
  phase: main
  contract: architecture.yaml

claim:
  claimed_by: null
  claimed_at: null
  lock: free

scope:
  files_allowed: []
  repos_allowed: [harness]

depends_on:
  decisions: []
  questions: []
  steps: []

verification:
  checks: []
  cases: []
  expected_result: null

status: idle
blocked_reason: null
