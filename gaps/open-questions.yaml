# Open questions — what the specification does not yet answer.
#
# This file is a DELIVERABLE, not a failure report. In greenfield work the
# single most valuable thing a harness produces early is an exact list of what
# nobody has decided yet — written precisely enough that a product owner can
# answer it in one sitting.
#
# A question belongs here when an agent would otherwise have to guess. A
# question that an agent can answer from the specification does not.
#
# WRITE EVERY QUESTION IN ASD-STE100 — Simplified Technical English. One
# instruction per sentence, at most 20 words. A descriptive sentence, at most
# 25. Active voice, and name the actor. Simple tenses only. One term for one
# thing, every time. No idiom. More than two items go in a vertical list. The
# rule covers the `question:`, `why_it_matters:` and `options:` text. It does
# not cover the specification those fields point at — correctness beats
# brevity. README.md says why, under "What makes the specification different
# from a document".
#
# Format:
#
#   - id: Q-001                 # Q-nnn, stable, never renumbered
#     status: open              # open | answered | withdrawn
#     raised_on: "2026-11-06"
#     raised_by: spec-author
#     blocks: [E1-B04]          # behaviour ids that stay `status: open`
#     question: >               # one question, answerable, not a topic
#     why_it_matters: >         # the consequence of guessing wrong
#     options:                  # at least two, each with its consequence
#       - id: a
#         option: ...
#         consequence: ...
#     asked_of: product owner
#     answer: null              # filled when status becomes answered
#
# checks/spec-completeness.sh enforces: two options minimum, every option has a
# consequence, and `blocks` stays consistent with the behaviour's own status.

version: 1

questions: []
