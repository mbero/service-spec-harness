id: A-E1-03
title: Vendor outage degrades the vendor object instead of failing the request
endpoint: E1
proves: [E1-B03, GL-B01]
status: approved
approved:
  by: Marcin Berendt
  date: "2026-11-06"

given:
  upstream:
    - integration: I1
      request:
        method: GET
        path: /api/v1/vendors/42
      respond:
        status: 503
        times: 3            # the full retry budget from integrations.yaml I1
  state:
    - entity: task
      values: { id: 7, title: "Replace brake pads", status: OPEN, vendorId: 42 }

when:
  method: GET
  path: /api/v1/tasks/7
  headers:
    Authorization: "Bearer {{token}}"
  query: {}
  body: null

then:
  status: 200
  headers:
    X-TRACE-ID: { present: true }
  body:
    json_contains:
      id: 7
      vendor: { id: 42 }
  absent_fields: [vendor.name]
