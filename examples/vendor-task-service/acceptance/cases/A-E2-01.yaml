id: A-E2-01
title: Valid payload creates the task and returns 201 with Location
endpoint: E2
proves: [E2-B01]
status: approved
approved:
  by: Marcin Berendt
  date: "2026-11-06"

given:
  upstream: []
  state: []

when:
  method: POST
  path: /api/v1/tasks
  headers:
    Authorization: "Bearer {{token}}"
    Content-Type: "application/json"
  query: {}
  body:
    title: "Replace brake pads"
    vendorId: 42
    externalRef: "PO-1001"

then:
  status: 201
  headers:
    Location: { matches: "^/api/v1/tasks/[0-9]+$" }
    X-TRACE-ID: { present: true }
  body:
    json_contains:
      title: "Replace brake pads"
      status: "OPEN"
  absent_fields: []
