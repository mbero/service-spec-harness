version: 1

integrations:

  - id: I1
    name: vendor-service
    status: agreed
    evidence: "PD-002"
    transport: http
    base_url_property: vendor.service.url
    auth: bearer passthrough

    timeouts:
      connect_ms: 1000
      read_ms: 2000

    retry:
      attempts: 3
      on: [5xx, connect-timeout]
      backoff_ms: 200

    on_failure:
      behaviour: degrade
      observable: >
        The caller still receives 200. The vendor object carries `id` only;
        `name` is absent. No error is surfaced to the caller — the outage is
        visible on the metric vendortask.vendor.degraded, not in the response.

    used_by: [E1]
