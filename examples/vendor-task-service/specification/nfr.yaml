version: 1

requirements:

  - id: N1
    category: observability
    status: agreed
    evidence: "ADR-4 §5"
    requirement: >
      A counter vendortask.vendor.degraded, tagged market, increments once per
      request that fell back to the degraded vendor rendering.
    verified_by: A-E1-03

  - id: N2
    category: security
    status: agreed
    evidence: "ADR-12"
    requirement: >
      No Authorization header, bearer token or apikey value is ever written to a
      log line, a metric tag or an error body.
    verified_by: checks/secrets.sh
