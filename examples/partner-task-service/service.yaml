# Filled manifest — this is what an instantiated harness looks like.
# The template copy, with the <<REQUIRED>> markers still in it, is at the repo root.

harness:
  version: 1
  mode: greenfield
  tier: M

project:
  name: partner-task-service
  description: >
    Stores tasks assigned to partners and serves them to the partner portal with
    the partner's name resolved per request. It does not schedule, execute or
    notify anything.

  jira:
    parent: VT-100
    implementation: VT-104

repositories:
  target:
    path: ./target-sample
    branch: feat/VT-104
    read_only: false
  harness:
    path: .
    branch: feat/VT-104

commit_messages:
  convention: conventional-commits
  subject: "<type>: [<JIRA-KEY>] <subject>"
  jira_key:
    target: VT-104
    harness: VT-103
  types: [feat, fix, refactor]
  rules:
    - The Jira key is REQUIRED, in square brackets, immediately after the type.
    - Subject is one line, no trailing period.
    - No agent ever runs git commit, git push, git checkout -b or gh pr create.

constraints:
  required:
    language: Java
    language_version: "25"
    framework: Spring MVC
    build: maven
  forbidden:
    - pattern: 'spring-boot-starter-webflux|spring-webflux|reactor-core'
      files: ['pom.xml']
      reason: "the service is blocking Spring MVC; the reactive stack is not on the classpath"
    - pattern: '\bMono<|\bFlux<|import\s+reactor\.'
      files: ['*.java']
      reason: "reactive types in a blocking service"
    - pattern: '[^a-zA-Z]WebClient\b'
      files: ['*.java']
      reason: "WebClient pulls the reactive stack back in; use RestClient"

phases:
  - id: main
    contract: architecture.yaml
    description: The specified service. Every acceptance case must pass.
    exit_criteria:
      - acceptance_100pct
      - checks_all_green
      - no_open_blocking_decisions

agents:
  spec_author:   { role: specification_author, prompt: prompts/system.md + .claude/agents/spec-author.md,       writes_target_code: false }
  orchestrator:  { role: build_orchestrator,   prompt: prompts/system.md + .claude/agents/build-orchestrator.md,       writes_target_code: false }
  implementer:   { role: build_implementer,    prompt: prompts/system.md + .claude/agents/build-implementer.md }
  reviewer:      { role: build_reviewer,       prompt: prompts/system.md + .claude/agents/build-reviewer.md,     read_only_except: [reports/reviews/] }
  advisor:       { role: independent_advisor,  prompt: prompts/system.md + .claude/agents/independent-advisor.md,    read_only_except: [reports/reviews/] }

validation:
  required:
    - spec_completeness
    - compilation
    - unit_tests
    - acceptance_cases
    - architecture_checks
    - forbidden_technology_checks
    - advisor_review
  stop_on:
    - unresolved_open_question
    - unresolved_blocking_decision
    - critical_advisor_finding
    - failed_required_validation

artifacts:
  manifest: service.yaml
  architecture: architecture.yaml
  specification: specification/
  acceptance: acceptance/
  gaps: gaps/open-questions.yaml
  decisions: decisions.yaml
  decisions_index: decisions.yaml
